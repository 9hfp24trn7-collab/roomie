:root{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:#343b35;background:#f8f5f0}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #92ab91;outline-offset:2px}.app{max-width:510px;margin:auto;min-height:100dvh;padding:25px 19px 110px}.top{display:flex;align-items:center;justify-content:space-between}.logo{font-size:19px;font-weight:900;letter-spacing:3px;color:#536a55}.tag{font-size:11px;letter-spacing:1px;color:#a4a39d}.avatar{border:0;background:#dce8d8;width:42px;height:42px;border-radius:50%;font-size:20px}h1{font-size:30px;letter-spacing:-1.2px;margin:30px 0 4px}p{color:#858981;margin:0}.section{display:flex;justify-content:space-between;align-items:center;margin:27px 0 13px}.section h2{font-size:19px;margin:0}.muted{font-size:12px;color:#90968e}.house{background:#eee9df;border-radius:25px;padding:18px;overflow:hidden}.househead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.tiny{font-size:11px;color:#788376}.objects{display:flex;align-items:center;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 8px 16px;scrollbar-width:none}.objects::-webkit-scrollbar{display:none}.object{flex:0 0 74%;min-height:220px;scroll-snap-align:center;border:1px solid #e6e0d4;background:#fffaf1;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;transition:transform .2s}.object:active{transform:scale(.98)}.object .art{font-size:92px;filter:drop-shadow(0 8px 8px #00000014);line-height:1.4}.object strong{font-size:16px}.object small{color:#9b9f94;margin-top:4px}.pill{background:#dce9d9;color:#4d7153;border-radius:30px;padding:7px 12px;font-size:12px;font-weight:700}.note{font-size:12px;color:#848b80;line-height:1.5;margin-top:12px}.tabs{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);max-width:510px;width:100%;background:#fffefaee;backdrop-filter:blur(14px);border-top:1px solid #eee9e2;display:grid;grid-template-columns:repeat(4,1fr);padding:12px 4px max(12px,env(safe-area-inset-bottom))}.tab{border:0;background:none;color:#9a9c96;display:grid;gap:4px;place-items:center;font-size:11px}.tab span{font-size:22px}.tab.active{color:#58765e;font-weight:800}.task{display:flex;align-items:center;gap:12px;background:white;border:1px solid #f0eee8;border-radius:18px;padding:14px 13px;margin:9px 0}.task .emoji{font-size:26px;background:#f5f2ec;border-radius:12px;width:46px;height:46px;display:grid;place-items:center}.task .body{flex:1;min-width:0}.task strong{font-size:14px}.task small{display:block;font-size:11px;color:#9a9e98;margin-top:5px}.check{appearance:none;border:2px solid #cbd7c8;border-radius:50%;width:25px;height:25px;flex-shrink:0;display:grid;place-items:center;background:white}.check.done{background:#79977d;color:white;border-color:#79977d}.check.done:after{content:'✓'}.done-text{text-decoration:line-through;color:#9b9e99}.add{width:100%;border:1px dashed #b8c6b7;border-radius:16px;background:#eef3ea;padding:14px;color:#56765c;font-weight:700;margin-top:10px}.primary{border:0;background:#78967d;color:white;padding:13px 16px;border-radius:14px;font-weight:750}.secondary{border:0;background:#f1f2ed;color:#647967;padding:11px 14px;border-radius:13px}.field{display:grid;gap:7px;font-size:13px;font-weight:700;margin:12px 0}.field input,.field select{width:100%;border:1px solid #e3e7dd;background:white;border-radius:12px;padding:12px;color:#354438}.panel{background:white;border:1px solid #eeece6;border-radius:20px;padding:17px;margin:12px 0}.panel h3{margin:0 0 12px;font-size:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.small{font-size:12px;color:#858d84}.expense{padding:13px 0;border-bottom:1px solid #f2f0eb}.expense:last-child{border:0}.amount{font-weight:800;color:#516b56}.hidden{display:none!important}.overlay{position:fixed;inset:0;z-index:30;background:#252e2780;display:flex;align-items:end;justify-content:center}.sheet{width:min(100%,510px);max-height:85dvh;overflow:auto;background:#fcfaf6;border-radius:24px 24px 0 0;padding:23px 20px 30px}.sheet h2{margin:0 0 10px}.close{float:right;border:0;background:#eeeae1;border-radius:50%;width:32px;height:32px}.actions{display:flex;gap:9px;margin-top:14px}.actions>*{flex:1}.empty{text-align:center;padding:25px;color:#90968e}.day{margin:14px 0;font-weight:800}.chip{display:inline-block;padding:6px 9px;border-radius:20px;background:#f1eee7;font-size:11px;color:#777d75}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#405b46;color:white;padding:11px 17px;border-radius:14px;z-index:50;max-width:90%;text-align:center;font-size:13px} @media(min-width:650px){body{background:#e9e6df}.app{background:#f8f5f0;box-shadow:0 0 60px #0000000c}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style><style>:root{color:#374938;background:#f9f7f1;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}body{background:#eeeae0}.app{max-width:620px;padding:30px 26px 115px;background:#f9f7f1}.tabs{max-width:620px;background:#fcfaf5f2;padding-top:15px;padding-bottom:max(17px,env(safe-area-inset-bottom))}.logo{font-size:23px;letter-spacing:4px}.tag{font-size:8px;letter-spacing:1.6px;margin-top:5px}.avatar{background:#e9eadc}.eyebrow{font-size:10px;letter-spacing:2px;color:#8b927d;margin-top:32px;margin-bottom:12px;font-weight:700}h1{font-family:Georgia,'Times New Roman',serif;font-size:42px;font-weight:400;line-height:1.12;letter-spacing:-1.5px;margin:14px 0}.intro{font-size:14px;line-height:1.65;color:#818774}.local-note{font-size:10px;color:#747e68;padding:10px 12px;border:1px solid #e4e5d9;border-radius:9px;margin:18px 0}.room-tabs{display:flex;gap:4px;overflow:auto;margin:24px 0 15px}.room-tabs button{flex:1;border:0;background:none;color:#858b7a;padding:10px 8px;border-radius:30px;font-size:12px;white-space:nowrap}.room-tabs .selected{background:#52684d;color:white}.room-scene{border:1px solid #e0e2d0;border-radius:25px;padding:16px;background:#eeefdf}.scene-label{display:flex;justify-content:space-between;font-size:13px;padding:0 6px;font-weight:650}.room-scene svg{width:100%;height:240px;display:block}.room-scene p{text-align:center;font-size:11px;color:#7e896c;padding-bottom:5px}.object-links{display:flex;gap:10px;margin:14px 0 28px}.object-links button{flex:1;background:#fffdf7;border:1px solid #e8e7da;border-radius:15px;padding:14px 7px;color:#465b40;font-size:11px;display:grid;justify-items:center;gap:6px}.object-links button span{font-size:25px}.object-links small{font-size:9px;color:#92977e}.section h2{font-family:Georgia,serif;font-size:22px;font-weight:400}.task{border:1px solid #e8e7dc;box-shadow:none;background:#fffdf8;padding:16px 13px;border-radius:15px}.task strong{font-size:13px;font-weight:550}.task small{line-height:1.55;color:#949882}.check{width:26px;height:26px;border-color:#c4cdb7;background:transparent}.mini,.textbtn{border:0;background:transparent;color:#617753;font-size:12px;padding:8px}.mini{border-radius:10px;background:#f0f2e8;flex-shrink:0}.add{background:transparent;border-color:#c8cfb9;color:#647953;font-size:12px;padding:15px}.primary{background:#526b4d;font-size:13px}.secondary{font-size:12px}.full{width:100%;margin-top:14px}.search,.inline-form input{font:inherit;font-size:13px;border:1px solid #e1e3d4;background:#fffdf8;padding:15px;border-radius:13px;width:100%;color:#3f5137}.segmented{display:flex;gap:8px;margin:25px 0 18px}.segmented button{border:1px solid #e0e4d4;background:transparent;color:#718062;padding:9px 19px;border-radius:30px}.segmented .selected{background:#e6ecdc;color:#3f5835}.goods{display:flex;flex-wrap:wrap;gap:9px;margin:27px 0 20px}.goods button{border:1px solid #dde3cf;border-radius:22px;background:#edf1e4;padding:11px 14px;font-size:12px;color:#526942}.inline-form{display:flex;gap:9px;margin-bottom:25px}.inline-form input{min-width:0}.template{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:16px 12px;border:1px solid #e4e5d9;border-radius:12px;margin:8px 0;background:#fffdf8;text-align:left;color:#43553b;font-size:13px}.template small{color:#8a957a;font-size:10px}.checkbox-label{display:flex;align-items:center;gap:9px;line-height:1.5;font-size:13px;margin-top:15px}.checkbox-label input{width:20px;height:20px;accent-color:#526b4d}.sheet{max-width:620px;background:#f9f7f1}.sheet h2{font-family:Georgia,serif;font-size:27px;font-weight:400;padding-right:25px}.empty{font-size:12px;line-height:1.6}.note{line-height:1.6}.panel{background:#fffdf8}.room-tabs button:focus-visible,.template:focus-visible,.goods button:focus-visible{outline:3px solid #92ab91;outline-offset:2px}@media(max-width:380px){.app{padding-left:16px;padding-right:16px}h1{font-size:36px}.tag{font-size:7px}.room-tabs button{font-size:11px;padding:10px 6 </style></head><body><main class="app"><header class="top"><div><div class="logo">ROOMIE<span style="color:#b7a7a0">.</span></div><div class="tag">OUR LITTLE SPACE</div></div><button class="avatar" aria-label="Мешканці" onclick="showTab('people')">🏡</button></header><div id="view"></div></main><nav class="tabs" aria-label="Навігація"><button class="tab active" data-tab="home" onclick="showTab('home')"><span>⌂</span>Дім</button><button class="tab" data-tab="calendar" onclick="showTab('calendar')"><span>▦</span>Календар</button><button class="tab" data-tab="budget" onclick="showTab('budget')"><span>◉</span>Бюджет</button><button class="tab" data-tab="people" onclick="showTab('people')"><span>♡</span>Ми</button></nav><div id="modal" class="overlay hidden" role="dialog" aria-modal="true"><div class="sheet"><button class="close" onclick="closeModal()" aria-label="Закрити">×</button><div id="modalContent"></div></div></div><div id="toast" class="toast hidden" role="status"></div><script>
const starter=[['Помити посуд','Я','daily','🍽️','sink'],['Винести сміття','Інша людина','none','🗑️','trash'],['Випрати речі','Я','weekly','🧺','washer'],['Купити продукти','Інша людина','none','🛒','fridge'],['Прибрати квартиру','Я','weekly','🧹','clean'],['Змінити постіль','Інша людина','biweekly','🛏️','bed']].map((a,i)=>({id:i+1,title:a[0],person:a[1],repeat:a[2],emoji:a[3],object:a[4],due:'',done:false,lastDone:''}));
const defaults={tasks:starter,expenses:[],shopping:[],members:['Я','Інша людина']};let state;try{state=JSON.parse(localStorage.getItem('roomie_v1'))||structuredClone(defaults)}catch(e){state=structuredClone(defaults)};if(!Array.isArray(state.tasks))state.tasks=starter;if(!Array.isArray(state.expenses))state.expenses=[];if(!Array.isArray(state.shopping))state.shopping=[];if(!Array.isArray(state.members))state.members=['Я','Інша людина'];let current='home';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem('roomie_v1',JSON.stringify(state));const today=()=>new Date().toLocaleDateString('sv-SE');const repeatLabel={none:'Одноразово',daily:'Щодня',weekly:'Щотижня',biweekly:'Раз на 2 тижні',monthly:'Щомісяця'};const objectData=[['fridge','🧊','Холодильник','Продукти та покупки'],['washer','🫧','Пральна машина','Прання та догляд'],['sink','🚰','Мийка','Посуд та кухня'],['trash','🗑️','Смітник','Порядок у домі'],['clean','🧹','Прибирання','Чистота й затишок'],['bed','🛏️','Спальня','Постіль і відпочинок']];function completed(t){if(t.repeat==='none')return !!t.done;if(!t.lastDone)return false;let d=new Date(t.lastDone+'T12:00:00'),now=new Date(today()+'T12:00:00'),days=Math.floor((now-d)/86400000);return days<({daily:1,weekly:7,biweekly:14,monthly:30}[t.repeat]||1)}function toggleTask(id){const t=state.tasks.find(t=>t.id===id);if(!t)return;if(t.repeat==='none')t.done=!t.done;else t.lastDone=completed(t)?'':today();save();render()}function taskHTML(t){let done=completed(t);return `<div class="task"><div class="emoji">${esc(t.emoji||'✨')}</div><div class="body"><strong class="${done?'done-text':''}">${esc(t.title)}</strong><small>${esc(t.person)} · ${esc(t.due||repeatLabel[t.repeat]||'Без дедлайну')}${done?' · Готово':''}</small></div><button class="check ${done?'done':''}" aria-label="${done?'Скасувати виконання':'Позначити виконаним'}: ${esc(t.title)}" onclick="toggleTask(${Number(t.id)})"></button></div>`}function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===current));let v=$('view');if(current==='home'){let mine=state.tasks.filter(t=>t.person===state.members[0]);let others=state.tasks.filter(t=>t.person!==state.members[0]);v.innerHTML=`<h1>Вдома добре. ♡</h1><p>Трохи турботи — і дім стає затишнішим.</p><div class="section"><h2>Наш маленький дім</h2><span class="pill">${state.tasks.filter(t=>!completed(t)).length} справ</span></div><section class="house"><div class="househead"><span class="tiny">Проведи вбік, щоб побачити більше →</span><span class="tiny">✦</span></div><div class="objects">${objectData.map(o=>`<button class="object" onclick="openObject('${o[0]}')"><span class="art">${o[1]}</span><strong>${o[2]}</strong><small>${o[3]}</small></button>`).join('')}</div><div class="note">Натисни на предмет, щоб побачити пов'язані справи. Холодильник також відкриває список покупок.</div></section><div class="section"><h2>Мої справи</h2><span class="muted">${mine.filter(t=>completed(t)).length} із ${mine.length} виконано</span></div>${mine.map(taskHTML).join('')||'<div class="empty">Поки немає справ ♡</div>'}<button class="add" onclick="openTaskForm()">＋ Додати справу</button><div class="section"><h2>Справи іншої людини</h2></div>${others.map(taskHTML).join('')||'<div class="empty">Поки немає справ</div>'}<div class="panel"><h3>Не можеш почати?</h3><p class="small">Без тиску. Просто один маленький крок.</p><button class="secondary" style="margin-top:12px" onclick="firstStep()">♡ Допоможи почати</button></div>`}else if(current==='calendar'){let dated=state.tasks.filter(t=>t.due).sort((a,b)=>a.due.localeCompare(b.due));v.innerHTML=`<h1>Календар 📅</h1><p>Усе важливе в одному місці.</p><div class="section"><h2>Заплановані справи</h2></div>${dated.map(t=>`<div class="day">${esc(t.due)}</div>${taskHTML(t)}`).join('')||'<div class="panel small">Поки немає справ із конкретними датами. Повторювані справи можна переглянути нижче.</div>'}<div class="section"><h2>Регулярні справи</h2></div>${state.tasks.filter(t=>t.repeat!=='none').map(taskHTML).join('')}<button class="add" onclick="openTaskForm()">＋ Запланувати справу</button>`}else if(current==='budget'){let total=state.expenses.reduce((a,e)=>a+Number(e.amount),0),net=state.expenses.reduce((a,e)=>a+(e.payer===state.members[0]?1:-1)*Number(e.amount)/2,0);v.innerHTML=`<h1>Наш бюджет ☕</h1><p>Спільні витрати — без зайвих таблиць.</p><div class="panel"><span class="small">Загальні витрати</span><h1 style="margin:7px 0">${total.toFixed(2)} ₴</h1><span class="chip">Ділимо порівну (50/50)</span><p class="small" style="margin-top:15px">${net===0?'Усе порівну ♡':net>0?esc(state.members[1])+' винен/винна '+esc(state.members[0])+': '+net.toFixed(2)+' ₴':esc(state.members[0])+' винен/винна '+esc(state.members[1])+': '+Math.abs(net).toFixed(2)+' ₴'}</p></div><button class="add" onclick="openExpenseForm()">＋ Додати витрату</button><div class="section"><h2>Історія</h2></div>${state.expenses.slice().reverse().map(e=>`<div class="panel row"><div><strong>${esc(e.title)}</strong><div class="small">Оплатив(ла): ${esc(e.payer)} · ${esc(e.date)}</div></div><span class="amount">${Number(e.amount).toFixed(2)} ₴</span></div>`).join('')||'<div class="empty">Поки немає витрат</div>'}` }else{v.innerHTML=`<h1>Наші люди ♡</h1><p>Маленька команда великого затишку.</p><div class="panel"><h3>Мешканці</h3><label class="field">Перший мешканець<input id="member0" maxlength="35" value="${esc(state.members[0])}"></label><label class="field">Другий мешканець<input id="member1" maxlength="35" value="${esc(state.members[1])}"></label><button class="primary" onclick="saveMembers()">Зберегти імена</button></div><div class="panel"><h3>Про цю версію</h3><p class="small">Дані зберігаються тільки в цьому браузері на цьому пристрої. Спільної синхронізації між телефонами поки немає. Не очищуй дані браузера, якщо хочеш зберегти справи.</p></div><div class="panel"><h3>Резервна копія</h3><p class="small">Збережи всі справи, покупки й витрати у файл, щоб не втратити їх.</p><button class="secondary" style="margin-top:12px" onclick="exportData()">↓ Завантажити дані</button></div>`}}function showTab(tab){current=tab;render();window.scrollTo({top:0,behavior:'smooth'})}function closeModal(){$('modal').classList.add('hidden')};function openModal(html){$('modalContent').innerHTML=html;$('modal').classList.remove('hidden')};function toast(s){let t=$('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),2700)}function openObject(key){let o=objectData.find(x=>x[0]===key),tasks=state.tasks.filter(t=>t.object===key);openModal(`<h2>${o[1]} ${o[2]}</h2><p class="small">${o[3]}</p>${tasks.map(taskHTML).join('')||'<div class="empty">Тут ще немає справ</div>'}${key==='fridge'?`<h3>Список покупок 🛒</h3><div id="shoppingItems">${state.shopping.map((s,i)=>`<div class="task"><button class="check ${s.done?'done':''}" onclick="toggleShopping(${i})"></button><div class="body ${s.done?'done-text':''}">${esc(s.text)}</div><button class="secondary" onclick="removeShopping(${i})" aria-label="Видалити">×</button></div>`).join('')}</div><form onsubmit="addShopping(event)"><label class="field">Що потрібно купити?<input name="item" maxlength="90" required placeholder="Наприклад, молоко"></label><button class="primary" type="submit">Додати</button></form>`:''}<button class="add" onclick="openTaskForm('${key}')">＋ Додати справу</button>`)}function toggleShopping(i){state.shopping[i].done=!state.shopping[i].done;save();openObject('fridge')}function removeShopping(i){state.shopping.splice(i,1);save();openObject('fridge')}function addShopping(e){e.preventDefault();let text=e.target.elements.item.value.trim();if(text){state.shopping.push({text,done:false});save();openObject('fridge')}}function openTaskForm(object=''){openModal(`<h2>Нова справа ✨</h2><p class="small">Лише найважливіше. Решту можна залишити порожнім.</p><form onsubmit="addTask(event)"><label class="field">Що потрібно зробити?<input name="title" required maxlength="100" placeholder="Наприклад, полити квіти" autofocus></label><label class="field">Відповідальний<select name="person">${state.members.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('')}</select></label><label class="field">Дедлайн (необов'язково)<input type="date" name="due"></label><label class="field">Повторення<select name="repeat"><option value="none">Не повторювати</option><option value="daily">Щодня</option><option value="weekly">Щотижня</option><option value="biweekly">Раз на 2 тижні</option><option value="monthly">Щомісяця</option></select></label><label class="field">Місце<select name="object">${objectData.map(o=>`<option value="${o[0]}" ${o[0]===object?'selected':''}>${o[2]}</option>`).join('')}</select></label><button class="primary" style="width:100%" type="submit">Додати справу ♡</button></form>`)}function addTask(e){e.preventDefault();let f=e.target.elements,title=f.title.value.trim();if(!title)return;state.tasks.push({id:Date.now(),title,person:f.person.value,due:f.due.value,repeat:f.repeat.value,object:f.object.value,emoji:objectData.find(o=>o[0]===f.object.value)?.[1]||'✨',done:false,lastDone:''});save();closeModal();render();toast('Справу додано ♡')}function openExpenseForm(){openModal(`<h2>Нова витрата 💸</h2><form onsubmit="addExpense(event)"><label class="field">За що?<input name="title" required maxlength="90" placeholder="Продукти"></label><label class="field">Сума, ₴<input name="amount" type="number" min="0.01" step="0.01" required placeholder="250"></label><label class="field">Хто оплатив?<select name="payer">${state.members.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('')}</select></label><button class="primary" type="submit" style="width:100%">Зберегти</button></form>`)}function addExpense(e){e.preventDefault();let f=e.target.elements,amount=Number(f.amount.value);if(!(amount>0&&Number.isFinite(amount)))return;state.expenses.push({title:f.title.value.trim(),amount,payer:f.payer.value,date:today()});save();closeModal();render();toast('Витрату додано')}function saveMembers(){let a=$('member0').value.trim(),b=$('member1').value.trim();if(!a||!b||a===b){toast('Введи два різні імені');return}let old=state.members;state.tasks.forEach(t=>{if(t.person===old[0])t.person=a;else if(t.person===old[1])t.person=b});state.expenses.forEach(e=>{if(e.payer===old[0])e.payer=a;else if(e.payer===old[1])e.payer=b});state.members=[a,b];save();render();toast('Імена оновлено')}function firstStep(){let t=state.tasks.find(t=>t.person===state.members[0]&&!completed(t));if(!t){toast('Усі твої справи виконано ♡');return}let suggestions={'Помити посуд':'Просто підійди до мийки й увімкни воду.','Випрати речі':'Поклади лише одну річ у кошик для прання.','Прибрати квартиру':'Прибери одну річ на її місце.'};openModal(`<h2>Маленький крок ♡</h2><p>Твоя справа: <strong>${esc(t.title)}</strong></p><div class="panel">${esc(suggestions[t.title]||'Почни з найменшої дії, яка займе менше хвилини.')}</div><p class="small">Не потрібно робити все одразу.</p><button class="primary" style="margin-top:16px;width:100%" onclick="closeModal()">Добре, спробую</button>`)}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='roomie-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script><script>const originalRender=render, originalToggle=toggleTask, originalSave=save;

" y="155" width="47" height="38" rx="9" fill="#d7ad96"/><ellipse cx="173" cy="239" rx="75" ry="14" fill="#c7ad8c"/><path d="M309 211v-79" stroke="#6c8a63" stroke-width="5"/><ellipse cx="295" cy="153" rx="12" ry="25" fill="#8aa17c" transform="rotate(-30 295 153)"/><ellipse cx="322" cy="136" rx="12" ry="25" fill="#76976e" transform="rotate(28 322 136)"/><path d="M289 200h40l-8 36h-23z" fill="#c99f83"/>'};return `<svg viewBox="0 0 360 270" aria-hidden="true"><rect x="15" y="28" width="330" height="223" rx="24" fill="#e7e8d8"/><path d="M15 217h330v10q0 24-24 24H39q-24 0-24-24z" fill="#d8d6bd"/><rect x="240" y="49" width="66" height="66" rx="30" fill="#f9f4dc"/>${drawings[id]}</svg>`}
function changeRoom(id){room=id;render()}
function taskCard(t){let done=completed(t),future=!done&&t.due&&t.due>today();return `<article class="task"><button class="check ${done?'done':''}" aria-label="${done?'Скасувати виконання':'Виконати'}: ${esc(t.title)}" onclick="toggleTask(${Number(t.id)})"></button><div class="body"><strong class="${done?'done-text':''}">${esc(t.title)}</strong><small>${esc(t.person||'Ніхто ще не взяв')} · ${done?'Виконано':future?'Заплановано на '+esc(t.due):esc(t.due||repeatLabel[t.repeat])}${t.rotate?' · По черзі':''}</small></div><button class="mini" aria-label="Налаштувати справу ${esc(t.title)}" onclick="editRoutine(${Number(t.id)})">⋯</button></article>`}
function routineControls(){return `<div class="segmented">${[['all','Усі'],['mine','Мої'],['free','Вільні']].map(([id,label])=>`<button class="${filter===id?'selected':''}" onclick="filter='${id}';render()">${label}</button>`).join('')}</div>`}
render=function(){document.querySelector('.tag').textContent='МЕНШЕ НАГАДУВАНЬ. БІЛЬШЕ ДОМУ.';document.querySelector('.tabs').innerHTML=[['home','⌂','Дім'],['calendar','✓','Справи'],['shopping','◌','Покупки'],['people','♡','Ми']].map(([id,i,n])=>`<button class="tab ${current===id?'active':''}" onclick="showTab('${id}')"><span>${i}</span>${n}</button>`).join('');const v=$('view');
if(current==='home'){const r=rooms.find(r=>r[0]===room);let pending=state.tasks.filter(t=>!completed(t)&&(!t.due||t.due<=today()));v.innerHTML=`<div class="eyebrow">ВАШ МАЛЕНЬКИЙ СПІЛЬНИЙ СВІТ</div><h1>Дім, про який<br>дбаємо разом.</h1><p class="intro">Знайти потрібне. Поділити справи.<br>Залишити більше часу для себе.</p><div class="local-note">На цьому пристрої · синхронізацію ще не підключено</div><div class="room-tabs">${rooms.map(x=>`<button class="${room===x[0]?'selected':''}" onclick="changeRoom('${x[0]}')">${x[1]}</button>`).join('')}</div><section class="room-scene"><div class="scene-label"><span>${r[1]}</span><span>${r[3]}</span></div>${roomArt(room)}<p>${r[2]}</p></section><div class="object-links">${r[4].map(k=>{let o=objectData.find(x=>x[0]===k);return `<button onclick="openObject('${k}')"><span>${icon[k]}</span>${o[2]}<small>Відкрити →</small></button>`}).join('')}</div><div class="section"><h2>Що зараз удома</h2><button class="textbtn" onclick="showTab('calendar')">Усі справи →</button></div>${pending.slice(0,3).map(taskCard).join('')||'<div class="panel">На сьогодні все спокійно. Можна видихнути ♡</div>'}<button class="add" onclick="openTemplates()">＋ Обрати готові справи</button><div class="section"><h2>Де що лежить?</h2><span class="muted">Пам’ять вашого дому</span></div><input class="search" aria-label="Знайти річ" placeholder="Наприклад, кабелі або постіль…" oninput="search=this.value;renderPlaces()"><div id="places"></div><button class="add" onclick="placeForm()">＋ Запам’ятати місце для речі</button>`;renderPlaces()}
else if(current==='calendar'){let list=state.tasks.filter(t=>filter==='mine'?t.person===state.members[0]:filter==='free'?!t.person:true);let pending=list.filter(t=>!completed(t)),done=list.filter(completed);v.innerHTML=`<div class="eyebrow">ВАШІ ДОМОВЛЕНОСТІ</div><h1>Побут на двох.</h1><p class="intro">Обирайте справи й домовляйтеся про чергу.</p>${routineControls()}${pending.map(taskCard).join('')||'<div class="empty">Тут поки немає справ.</div>'}<button class="add" onclick="openTemplates()">＋ Обрати з готових справ</button><button class="textbtn full" onclick="openTaskForm()">Написати власну справу</button>${done.length?'<div class="section"><h2>Уже зроблено ♡</h2></div>'+done.map(taskCard).join(''):''}`}
else if(current==='shopping'){v.innerHTML=`<div class="eyebrow">ЩО ПОТРІБНО ВАШОМУ ДОМУ</div><h1>Зайдемо по дорозі.</h1><p class="intro">Познач, що закінчується, та хто це купить.</p><div class="goods">${commonGoods.map((g,i)=>`<button onclick="quickGood(${i})">＋ ${g}</button>`).join('')}</div><form class="inline-form" onsubmit="quickShopping(event)"><input name="item" required maxlength="90" aria-label="Назва покупки" placeholder="Або додай щось своє…"><button class="primary" aria-label="Додати покупку">＋</button></form>${shoppingHTML()}<p class="note">Можна диктувати назву через мікрофон на клавіатурі телефона.</p>`}
else {originalRender();if(current==='people'){v.insertAdjacentHTML('afterbegin','<div class="local-note">Це версія для одного пристрою. Запрошення та спільне оновлення між телефонами ще не доступні.</div>');v.insertAdjacentHTML('beforeend','<button class="secondary full" onclick="showTab(\'budget\')">Відкрити збережений бюджет</button>')}}};
function shoppingHTML(){return state.shopping.map((s,i)=>`<div class="task"><button class="check ${s.done?'done':''}" aria-label="${s.done?'Повернути в покупки':'Позначити купленим'}: ${esc(s.text)}" onclick="toggleShopping(${i})"></button><div class="body"><strong class="${s.done?'done-text':''}">${esc(s.text)}</strong><small>${s.payer?'Купить: '+esc(s.payer):'Ще ніхто не взяв'}</small></div>${!s.done?`<button class="mini" onclick="claimShopping(${i})">${s.payer?'Змінити':'Я куплю'}</button>`:''}<button class="mini" aria-label="Видалити покупку" onclick="removeShopping(${i})">×</button></div>`).join('')||'<div class="empty">Усе є вдома, а список поки порожній.</div>'}
function addGood(text){if(state.shopping.some(s=>!s.done&&s.text.toLocaleLowerCase()===text.toLocaleLowerCase())){toast('Це вже є у списку покупок');return}state.shopping.push({text,done:false,payer:''});persist();render();toast('Додано до покупок')}
function quickGood(i){addGood(commonGoods[i])}function quickShopping(e){e.preventDefault();let text=e.target.elements.item.value.trim();if(text)addGood(text)}
toggleShopping=function(i){state.shopping[i].done=!state.shopping[i].done;persist();render()};removeShopping=function(i){state.shopping.splice(i,1);persist();render()};
function claimShopping(i){openModal(`<h2>Хто купить?</h2><p>${esc(state.shopping[i].text)}</p><div class="actions">${state.members.map((m,j)=>`<button class="primary" onclick="setBuyer(${i},${j})">${esc(m)}</button>`).join('')}</div><button class="textbtn full" onclick="setBuyer(${i},-1)">Залишити без відповідального</button>`)}function setBuyer(i,j){state.shopping[i].payer=j<0?'':state.members[j];persist();closeModal();render()}
openObject=function(key){activeObject=key;let o=objectData.find(x=>x[0]===key);openModal(`<div class="eyebrow">${roomFor(key)[1]}</div><h2>${o[2]}</h2><p class="small">Готові справи для цього місця.</p>${state.tasks.filter(t=>t.object===key).map(taskCard).join('')||'<div class="empty">Додай справу з готового набору нижче.</div>'}<button class="add" onclick="openTemplates('${key}')">＋ Обрати справи</button><button class="secondary full" onclick="closeModal();showTab('shopping')">Закінчується щось потрібне →</button>`)};
function openTemplates(key=''){activeObject=null;openModal(`<h2>Оберімо домашню рутину.</h2><p class="small">Натисни на справу, щоб налаштувати її один раз.</p>${objectData.filter(o=>!key||o[0]===key).map(o=>`<h3>${o[2]}</h3>${templates[o[0]].map((t,i)=>`<button class="template" onclick="chooseTemplate('${o[0]}',${i})"><span>${t[0]}</span><small>${repeatLabel[t[1]]} ＋</small></button>`).join('')}`).join('')}`)}
function chooseTemplate(key,i){let [title,repeat]=templates[key][i];let existing=state.tasks.find(t=>t.title===title&&t.object===key);if(existing){editRoutine(existing.id);return}let t={id:Date.now(),title,repeat,object:key,person:'',due:'',done:false,lastDone:'',emoji:objectData.find(o=>o[0]===key)[1]};routineForm(t,true)}
function editRoutine(id){activeObject=null;let t=state.tasks.find(t=>t.id===id);if(t)routineForm(t,false)}
function routineForm(t,isNew){openModal(`<h2>${isNew?'Нова домовленість':'Налаштування справи'}</h2><form onsubmit="saveRoutine(event,${t.id},${isNew},'${t.object}')"><label class="field">Справа<input name="title" required maxlength="100" value="${esc(t.title)}"></label><label class="field">Хто робить наступним?<select name="person"><option value="">Ще не домовилися</option>${state.members.map(m=>`<option ${t.person===m?'selected':''} value="${esc(m)}">${esc(m)}</option>`).join('')}</select></label><label class="field">Як часто?<select name="repeat">${Object.entries(repeatLabel).map(([k,v])=>`<option value="${k}" ${t.repeat===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Дата наступної справи<input type="date" name="due" value="${esc(t.due||'')}"></label><label class="checkbox-label"><input type="checkbox" name="rotate" ${t.rotate?'checked':''}> Після виконання передавати чергу іншому</label><p class="note">Для повторюваних справ, коли ви обоє погодилися.</p><button class="primary full" type="submit">${isNew?'Додати домовленість':'Зберегти домовленість'}</button></form>`)}
function saveRoutine(e,id,isNew,object){e.preventDefault();let f=e.target.elements,title=f.title.value.trim();if(!title)return;if(f.rotate.checked&&(!f.person.value||f.repeat.value==='none')){toast('Для чергування обери людину та повторення');return}let t=isNew?{id,object,done:false,lastDone:'',emoji:'✨'}:state.tasks.find(x=>x.id===id);Object.assign(t,{title,person:f.person.value,repeat:f.repeat.value,due:f.due.value,rotate:f.rotate.checked});delete t.undo;if(isNew)state.tasks.push(t);persist();closeModal();render()}
toggleTask=function(id){let t=state.tasks.find(t=>t.id===id);if(!t)return;if(completed(t)&&t.undo){Object.assign(t,t.undo);delete t.undo}else if(!completed(t)){t.undo={person:t.person,due:t.due,done:t.done,lastDone:t.lastDone};if(t.repeat==='none')t.done=true;else {t.lastDone=today();let days={daily:1,weekly:7,biweekly:14,monthly:30}[t.repeat]||1;t.due=nextDate(days);if(t.rotate&&state.members.includes(t.person))t.person=state.members[(state.members.indexOf(t.person)+1)%state.members.length]}}else{t.done=false;t.lastDone=''}persist();render();if(activeObject&&!$('modal').classList.contains('hidden'))openObject(activeObject)};
function renderPlaces(){let host=$('places');if(!host)return;let found=state.places.map((p,i)=>({...p,i})).filter(p=>(p.name+' '+p.location).toLocaleLowerCase().includes(search.toLocaleLowerCase()));host.innerHTML=found.map(p=>`<div class="task"><div class="body"><strong>${esc(p.name)}</strong><small>${esc(p.location)}</small></div><button class="mini" aria-label="Редагувати місце" onclick="placeForm(${p.i})">✎</button></div>`).join('')||`<div class="empty">${search?'Такої речі ще немає у вашій пам’ятці.':'Збережи місце для речі, яку часто шукаєте.'}</div>`}
function placeForm(i=-1){let p=state.places[i]||{name:'',location:''};openModal(`<h2>Усе на своєму місці.</h2><form onsubmit="savePlace(event,${i})"><label class="field">Що зберігаємо?<input name="name" required maxlength="90" value="${esc(p.name)}" placeholder="Запасні кабелі"></label><label class="field">Де це лежить?<input name="location" required maxlength="180" value="${esc(p.location)}" placeholder="Вітальня, верхня шухляда комода"></label><button class="primary full">Запам’ятати місце</button></form>`)}
function savePlace(e,i){e.preventDefault();let name=e.target.elements.name.value.trim(),location=e.target.elements.location.value.trim();if(!name||!location)return;let p={name,location};if(i<0)state.places.push(p);else state.places[i]=p;persist();closeModal();render()}
const oldMembersSave=saveMembers;saveMembers=function(){let old=[...state.members],newNames=[$('member0').value.trim(),$('member1').value.trim()];if(!newNames[0]||!newNames[1]||newNames[0]===newNames[1]){toast('Введи два різні імені');return}state.shopping.forEach(s=>{let i=old.indexOf(s.payer);if(i>=0)s.payer=newNames[i]});state.tasks.forEach(t=>{if(t.undo){let i=old.indexOf(t.undo.person);if(i>=0)t.undo.person=newNames[i]}});oldMembersSave()};
document.querySelector('.close').addEventListener('click',()=>activeObject=null);render();
</script></body></html>
